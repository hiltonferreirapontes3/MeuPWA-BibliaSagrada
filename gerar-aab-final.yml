name: Gerar AAB APK - Metodo Final Garantido

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Instalar Capacitor
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android
      - name: Criar projeto Capacitor
        run: |
          echo '{"appId":"com.hiltonferreira.bibliafidelidadeeverdade","appName":"Biblia Sagrada FV","webDir":".","server":{"url":"https://hiltonferreirapontes3.github.io/MeuPWA-BibliaSagrada/","cleartext":true}}' > capacitor.config.json
          npx cap add android
      - name: Build APK e AAB
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
          ./gradlew bundleDebug
          find app/build -name "*.aab" -o -name "*.apk" | xargs ls -lh
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: APK-Biblia-FV
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: AAB-Biblia-FV
          path: android/app/build/outputs/bundle/debug/app-debug.aab
