
name: Gerar AAB da Bíblia F&V

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Instalar Bubblewrap
        run: npm install -g @bubblewrap/cli

      - name: Criar projeto TWA
        run: |
          mkdir twa-build
          cd twa-build
          bubblewrap init --manifest https://hiltonferreirapontes3.github.io/MeuPWA-BibliaSagrada/manifest.webmanifest --directory . <<EOF
          com.hiltonferreira.bibliafidelidadeeverdade
          Bíblia Sagrada — Fidelidade e Verdade
          EOF
          cat twa-manifest.json

      - name: Build AAB
        run: |
          cd twa-build
          bubblewrap build --skipPwaValidation

      - name: Salvar AAB
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: twa-build/app-release-bundle.aab

      - name: Salvar APK também
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: twa-build/app-release-signed.apk
