name: Gerar APK AAB - PWABuilder Final

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Instalar PWABuilder
        run: npm install -g @pwabuilder/cli

      - name: Gerar projeto Android
        run: |
          npx pwabuilder https://hiltonferreirapontes3.github.io/MeuPWA-BibliaSagrada/ -p android -d ./pwa-android
          echo "=== CONTEUDO GERADO ==="
          ls -R ./pwa-android | head -n 100

      - name: Build AAB com Gradle
        run: |
          PROJ=$(find ./pwa-android -name "build.gradle" | head -1 | xargs dirname)
          echo "Projeto encontrado em: $PROJ"
          cd "$PROJ"
          chmod +x gradlew
          ./gradlew bundleRelease
          echo "=== AABs gerados ==="
          find . -name "*.aab" -o -name "*.apk"

      - name: Upload AAB e APK
        uses: actions/upload-artifact@v4
        with:
          name: Biblia-Sagrada-AAB-APK
          path: |
            **/*.aab
            **/*.apk
          if-no-files-found: error
