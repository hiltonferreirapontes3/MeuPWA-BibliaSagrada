name: Gerar AAB da Bíblia F&V
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Instalar Bubblewrap
        run: npm install -g @bubblewrap/cli
      - name: Build
        run: |
          mkdir twa
          cd twa
          bubblewrap init --manifest https://hiltonferreirapontes3.github.io/MeuPWA-BibliaSagrada/manifest.webmanifest
          bubblewrap build
      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: aab-gerado
          path: twa/app-release-bundle.aab
