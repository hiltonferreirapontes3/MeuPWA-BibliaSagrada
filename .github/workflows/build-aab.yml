
name: Gerar AAB da Bíblia F&V - CORRIGIDO

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar Bubblewrap
        run: npm install -g @bubblewrap/cli

      - name: Verificar manifest
        run: cat twa-manifest.json

      - name: Build AAB (sem perguntas)
        run: bubblewrap build --skipPwaValidation
        env:
          BUBBLEWRAP_SKIP_JDK_VERSION_CHECK: "true"

      - name: Listar arquivos
        run: ls -lh

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: AAB-Biblia-FV-Pronto
          path: app-release-bundle.aab

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: APK-Biblia-FV-Pronto
          path: app-release-signed.apk
