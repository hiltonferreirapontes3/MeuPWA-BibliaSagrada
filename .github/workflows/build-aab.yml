name: Gerar AAB da Bíblia F&V

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Setup Node
        uses: actions/setup-node@f08fbe9b0e5116a6fd88161a09c6f0e07872dfe2
        with:
          node-version: 20

      - name: Setup Java 17
        uses: actions/setup-java@b843ebf5601ab87dc6ab0b868899d9cd417f7312
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Instalar Bubblewrap
        run: npm install -g @bubblewrap/cli

      - name: Criar projeto TWA
        run: |
          mkdir twa-build
          cd twa-build
          bubblewrap init --manifest https://hiltonferreirapontes3.github.io/MeuPWA-BibliaSagrada/manifest.webmanifest --directory . <<EOF
          com.hiltonferreira.bibliafidelidadeeverdade
          Bíblia Sagrada — Fidelidade e Verdade
          EOF
          cat twa-manifest.json

      - name: Build AAB
        run: |
          cd twa-build
          bubblewrap build --skipPwaValidation

      - name: Salvar AAB
        uses: actions/upload-artifact@6c6b9b156295f302c9ccdd3f2608762b3fa11526
        with:
          name: app-release-aab
          path: twa-build/app-release-bundle.aab

      - name: Salvar APK também
        uses: actions/upload-artifact@6c6b9b156295f302c9ccdd3f2608762b3fa11526
        with:
          name: app-release-apk
          path: twa-build/app-release-signed.apk
