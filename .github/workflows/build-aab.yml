
name: Gerar AAB da Bíblia F&V

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Instalar Bubblewrap
        run: npm install -g @bubblewrap/cli

      - name: Limpar pasta antiga
        run: rm -rf twa-build

      - name: Criar projeto TWA (sem perguntas)
        run: |
          npx @bubblewrap/cli init --manifest https://hiltonferreirapontes3.github.io/MeuPWA-BibliaSagrada/manifest.webmanifest --packageId com.hiltonferreira.bibliafidelidadeeverdade --name "Biblia Sagrada FV" --host hiltonferreirapontes3.github.io --path /MeuPWA-BibliaSagrada/ --startUrl /MeuPWA-BibliaSagrada/ --display standalone --themeColor "#FCFBF7" --backgroundColor "#FCFBF7" --directory twa-build
          cat twa-build/twa-manifest.json || true

      - name: Gerar chave e construir AAB
        run: |
          cd twa-build
          npx @bubblewrap/cli build --skipPwaValidation

      - name: Mostrar arquivos gerados
        run: ls -lh twa-build/

      - name: Salvar AAB na nuvem
        uses: actions/upload-artifact@v4
        with:
          name: AAB-Biblia-FV
          path: twa-build/app-release-bundle.aab
          if-no-files-found: warn

      - name: Salvar APK também
        uses: actions/upload-artifact@v4
        with:
          name: APK-Biblia-FV
          path: twa-build/app-release-signed.apk
          if-no-files-found: warn
          
