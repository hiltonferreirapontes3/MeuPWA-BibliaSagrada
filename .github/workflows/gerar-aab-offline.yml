name: Gerar AAB APK - Local Offline

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar Capacitor
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: Criar config local (sem internet)
        run: |
          cat > capacitor.config.json << 'EOF'
          {
            "appId": "com.hiltonferreira.bibliafidelidadeeverdade",
            "appName": "Biblia Sagrada FV",
            "webDir": ".",
            "bundledWebRuntime": false
          }
          EOF
          cat capacitor.config.json
          npx cap add android

      - name: Build APK e AAB OFFLINE
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
          ./gradlew bundleDebug
          ls -lh app/build/outputs/apk/debug/
          ls -lh app/build/outputs/bundle/debug/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: APK-Biblia-FV-OFFLINE
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: AAB-Biblia-FV-OFFLINE
          path: android/app/build/outputs/bundle/debug/app-debug.aab
